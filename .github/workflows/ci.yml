name: Haystack - CI

# Consolidated workflow: test gate (lint + imports + pytest) runs on every PR
# and push to develop/master. After the test job passes:
#   push to develop      -> AU staging
#   push to master       -> production in every region in .github/regions.json
#   manual run + region  -> production in that ONE region, from the selected ref
#                           (AU only from master; see .github/scripts/plan-release.js)
#   manual run, no region -> tests only, as before
#
# Required-check name registered in branch-protection rulesets:
#   "Lint + Imports + Pytest"
# If you rename that job, update the GitHub branch-protection rulesets too.

on:
  pull_request:
    branches: [develop, master, main]
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      region:
        description: Production region to release the selected ref to (none = tests only)
        type: choice
        default: none
        options:
          - none
          - us
          - au

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      release: ${{ steps.targets.outputs.release }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Select the production regions this run releases to
        id: plan
        if: github.event_name != 'workflow_dispatch' || inputs.region != 'none'
        env:
          REQUESTED_REGION: ${{ inputs.region }}
        run: node .github/scripts/plan-release.js
      - name: Resolve deployment targets
        id: targets
        env:
          PRODUCTION_REGIONS: ${{ steps.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/develop ]; then
            # Staging exists for AU only and is not a production region.
            matrix='[{"code":"au","stage":"staging","environment":"","app":"antsa-haystack-au-staging","resourceGroup":"rg-antsa-staging"}]'
          else
            matrix="$(jq -c 'map({code, stage: "production", environment, app: .haystackApp, resourceGroup})' <<< "${PRODUCTION_REGIONS:-[]}")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "release=$(jq -r 'length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  test:
    name: Lint + Imports + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -c "import main; import haystack_pipeline; import tools; import personas; print('imports OK')"

      - name: Run pytest if any unit tests exist
        run: |
          # Look for pytest unit tests under tests/ only. The repo's
          # top-level test_integration.py is a manual smoke script that
          # needs a running server + auth token — not a pre-merge gate.
          if [ -d tests ] && find tests -name 'test_*.py' | head -1 | grep -q .; then
            pip install pytest
            pytest tests -x -q
          else
            echo "No tests/ directory with test_*.py files — skipping pytest. Smoke coverage runs post-deploy."
          fi

  deploy:
    name: Deploy to Azure (${{ matrix.target.code }} ${{ matrix.target.stage }})
    needs: [plan, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One region failing must not cancel another.
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: haystack-deploy-${{ matrix.target.code }}-${{ matrix.target.stage }}
      cancel-in-progress: false
    environment: ${{ matrix.target.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set environment variables
        run: |
          echo "DEPLOY_ENV=${{ matrix.target.stage }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ matrix.target.app }}" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=${{ matrix.target.resourceGroup }}" >> $GITHUB_ENV

      - name: Validate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import fastapi; import openai; import haystack; print('All imports OK')"

      - name: Create deployment package
        run: |
          mkdir deploy

          # Copy application source only (no venv - built on Azure at runtime).
          # Copy ALL root-level .py modules rather than a hardcoded list: the
          # explicit list silently dropped crisis_resources.py when it was added
          # (haystack_pipeline.py imports it), crashing the container on startup
          # with ModuleNotFoundError. A glob can't drift out of sync. Test-only
          # files (conftest.py, test_integration.py) are inert in wwwroot.
          cp *.py requirements.txt startup.sh deploy/
          cp -r components agents document_generation utils deploy/
          printf '{"gitSha":"%s"}\n' '${{ github.sha }}' > deploy/release.json

          # Verify main.py + every root module it transitively imports made it in.
          test -f deploy/main.py || { echo "ERROR: main.py not found!"; exit 1; }
          test -f deploy/crisis_resources.py || { echo "ERROR: crisis_resources.py not found!"; exit 1; }

          # Create Python entrypoint
          printf '#!/usr/bin/env python3\nimport subprocess, sys\nsys.exit(subprocess.call(["bash", "startup.sh"]))\n' > deploy/startup.py

          echo "Package contents:"
          ls -la deploy/
          echo "Package size: $(du -sh deploy/ | cut -f1)"

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ matrix.target.stage == 'production' && secrets[format('AZURE_CREDENTIALS_{0}', matrix.target.code)] || secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Deploy to Azure Web App (Production)
        if: env.DEPLOY_ENV == 'production'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          package: './deploy'
          slot-name: 'production'
          startup-command: 'python startup.py'

      - name: Deploy to Azure Web App (Staging)
        if: env.DEPLOY_ENV == 'staging'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_HAYSTACK_PUBLISHPROFILE_STAGING }}
          package: './deploy'

      - name: Configure platform health probing
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --generic-configurations '{"healthCheckPath":"/health"}'

      - name: Activate the exact deployed artifact
        run: |
          # Zip deployment can finish before an Always On worker recycles. An
          # explicit start/restart prevents readiness from observing stale code.
          az webapp start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME"
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$APP_NAME"

      - name: Require bounded deployed readiness
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          health_url="https://${APP_NAME}.azurewebsites.net/health"

          ready=false
          consecutive_successes=0
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl --fail --silent --show-error --max-time 10 "$health_url")" || body=""

            if [ -n "$body" ] && \
               printf '%s' "$body" | python -c 'import json,os,sys; body=json.load(sys.stdin); expected=os.environ["EXPECTED_RELEASE_SHA"].lower(); healthy=body.get("status") == "healthy" and body.get("pipeline") == "ready" and body.get("redis") == "ready" and body.get("llmRoutes") == "ready" and body.get("documentAgent") == "ready" and body.get("releaseSha") == expected; sys.exit(0 if healthy else 1)'; then
              consecutive_successes=$((consecutive_successes + 1))
              if [ "$consecutive_successes" -ge 3 ]; then
                ready=true
                break
              fi
            else
              # A worker recycle can briefly leave the previous worker serving
              # before the replacement starts. Reset the stability window on
              # every failed or incomplete probe.
              consecutive_successes=0
            fi
            sleep 10
          done

          if [ "$ready" != "true" ]; then
            echo "Haystack readiness was not continuously healthy within five minutes" >&2
            exit 1
          fi


  notify-develop-failure:
    name: Notify Teams — develop workflow failed
    needs: [test, deploy]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      (needs.test.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Notify Teams
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          TITLE: 'Haystack develop workflow failed'
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/teams-notify.sh
