name: Haystack - CI

# Consolidated workflow: test gate (lint + imports + pytest) runs on every PR
# and push to develop/master; AU deploy runs after the test job passes on
# develop or master pushes.
#
# Required-check name registered in branch-protection rulesets:
#   "Lint + Imports + Pytest"
# If you rename that job, update the GitHub branch-protection rulesets too.

on:
  pull_request:
    branches: [develop, master, main]
  push:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  test:
    name: Lint + Imports + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -c "import main; import haystack_pipeline; import tools; import personas; print('imports OK')"

      - name: Run pytest if any unit tests exist
        run: |
          # Look for pytest unit tests under tests/ only. The repo's
          # top-level test_integration.py is a manual smoke script that
          # needs a running server + auth token — not a pre-merge gate.
          if [ -d tests ] && find tests -name 'test_*.py' | head -1 | grep -q .; then
            pip install pytest
            pytest tests -x -q
          else
            echo "No tests/ directory with test_*.py files — skipping pytest. Smoke coverage runs post-deploy."
          fi

  deploy-au:
    name: Deploy to Azure (AU)
    needs: test
    # Only deploy on pushes to develop or master; skip on PRs and manual triggers
    # that did not target those branches.
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            ENV="production"
            APP_NAME="antsa-haystack-au-production"
          else
            ENV="staging"
            APP_NAME="antsa-haystack-au-staging"
          fi
          echo "DEPLOY_ENV=${ENV}" >> $GITHUB_ENV
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV

      - name: Validate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import fastapi; import openai; import haystack; print('All imports OK')"

      - name: Create deployment package
        run: |
          mkdir deploy

          # Copy application source only (no venv - built on Azure at runtime).
          # Copy ALL root-level .py modules rather than a hardcoded list: the
          # explicit list silently dropped crisis_resources.py when it was added
          # (haystack_pipeline.py imports it), crashing the container on startup
          # with ModuleNotFoundError. A glob can't drift out of sync. Test-only
          # files (conftest.py, test_integration.py) are inert in wwwroot.
          cp *.py requirements.txt startup.sh deploy/
          cp -r components agents document_generation utils deploy/

          # Verify main.py + every root module it transitively imports made it in.
          test -f deploy/main.py || { echo "ERROR: main.py not found!"; exit 1; }
          test -f deploy/crisis_resources.py || { echo "ERROR: crisis_resources.py not found!"; exit 1; }

          # Create Python entrypoint
          printf '#!/usr/bin/env python3\nimport subprocess, sys\nsys.exit(subprocess.call(["bash", "startup.sh"]))\n' > deploy/startup.py

          echo "Package contents:"
          ls -la deploy/
          echo "Package size: $(du -sh deploy/ | cut -f1)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ env.DEPLOY_ENV == 'production' && secrets.AZURE_CREDENTIALS_AU || secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Deploy to Azure Web App (Production)
        if: env.DEPLOY_ENV == 'production'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          package: './deploy'
          slot-name: 'production'
          startup-command: 'python startup.py'

      - name: Deploy to Azure Web App (Staging)
        if: env.DEPLOY_ENV == 'staging'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_HAYSTACK_PUBLISHPROFILE_STAGING }}
          package: './deploy'

      - name: Require bounded deployed readiness
        run: |
          set -euo pipefail
          health_url="https://${APP_NAME}.azurewebsites.net/health"
          probe_rule_name=""

          cleanup_probe_rule() {
            if [ -n "$probe_rule_name" ]; then
              az webapp config access-restriction remove \
                --resource-group "$resource_group" \
                --name "$APP_NAME" \
                --rule-name "$probe_rule_name" \
                --output none || true
              probe_rule_name=""
            fi
          }
          trap cleanup_probe_rule EXIT INT TERM

          # Staging is intentionally IP-restricted. Admit only this ephemeral
          # hosted runner while it performs the readiness probe, then remove
          # that exact rule on success, failure, or cancellation.
          if [ "$DEPLOY_ENV" = "staging" ]; then
            resource_group="rg-antsa-staging"

            runner_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)"
            python -c 'import ipaddress,sys; assert ipaddress.ip_address(sys.argv[1]).version == 4' "$runner_ip"

            minimum_priority="$(
              az webapp config access-restriction show \
                --resource-group "$resource_group" \
                --name "$APP_NAME" \
                --query 'min(ipSecurityRestrictions[].priority)' \
                --output tsv
            )"
            if [ -z "$minimum_priority" ] || [ "$minimum_priority" = "None" ]; then
              probe_priority=100
            elif [ "$minimum_priority" -gt 1 ]; then
              probe_priority=$((minimum_priority - 1))
            else
              echo "No higher-priority slot is available for the ephemeral staging probe" >&2
              exit 1
            fi

            probe_rule_name="ci-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            az webapp config access-restriction add \
              --resource-group "$resource_group" \
              --name "$APP_NAME" \
              --rule-name "$probe_rule_name" \
              --action Allow \
              --ip-address "${runner_ip}/32" \
              --priority "$probe_priority" \
              --output none
          fi

          for attempt in $(seq 1 60); do
            if body="$(curl --fail --silent --show-error --max-time 10 "$health_url")" && \
               printf '%s' "$body" | python -c 'import json,sys; body=json.load(sys.stdin); assert body.get("status") == "healthy"; assert body.get("pipeline") == "ready"; assert body.get("redis") == "ready"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Haystack readiness did not become healthy within five minutes" >&2
          exit 1


  notify-develop-failure:
    name: Notify Teams — develop workflow failed
    needs: [test, deploy-au]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      (needs.test.result == 'failure' || needs.deploy-au.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Notify Teams
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          TITLE: 'Haystack develop workflow failed'
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/teams-notify.sh
